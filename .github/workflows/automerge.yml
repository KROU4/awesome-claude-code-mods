# Merges a pull request when scripts/policy.mjs allows it (docs/governance.md), otherwise labels
# it `needs-maintainer` and keeps one bot comment up to date.
#
# Security: this workflow has a write token, so it never checks out or runs code from the pull
# request. It checks out the default branch (trusted scripts), reads the PR through the GitHub API
# as data, takes the PR number from the untrusted `pr-meta` artifact only as a positive integer,
# and acts only when the PR's head commit equals the commit Validate checked.
name: Automerge

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions: {}

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Merge or ask for a maintainer
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Check out the default branch (trusted code only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the pull request metadata
        uses: actions/download-artifact@v4
        with:
          name: pr-meta
          path: ${{ runner.temp }}/pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: >-
          node scripts/policy.mjs
          --pr-meta "$RUNNER_TEMP/pr-meta/pr.json"
          --head-sha "$HEAD_SHA"
          --validate-conclusion "$CONCLUSION"
          --out "$RUNNER_TEMP/decision.json"

      - name: Merge and start the sync
        if: steps.decide.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.decide.outputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
          gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Comment on the merge
        if: steps.decide.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bot-comment.mjs --decision "$RUNNER_TEMP/decision.json" --merged

      - name: Label and explain
        if: steps.decide.outputs.allowed != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node scripts/bot-comment.mjs --decision "$RUNNER_TEMP/decision.json" --run-url "$RUN_URL"
