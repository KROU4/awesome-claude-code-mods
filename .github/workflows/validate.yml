# Checks every pull request to main. Runs with a read-only token and no secrets, so it may run
# the PR's own code (unit tests, `claude plugin test` of hosted mods). Because a PR can change this
# file and the scripts it runs, its result is a quality check, not a security boundary: Automerge
# re-checks everything that matters for security, and the registry build drops entries that fail
# the schema. Its last step uploads pr.json ({ number, head_sha }) for the Automerge workflow,
# which treats it as untrusted input.
name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mods need Claude Code 2.1.287+. If the install fails, validate.mjs skips the CLI checks
      # with a warning instead of failing the run.
      - name: Install the Claude Code CLI
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302
          claude --version

      - name: Unit tests
        run: npm test

      - name: Validate the catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/validate.mjs --changed "$BASE_SHA"
          else
            node scripts/validate.mjs
          fi

      - name: Check whether the site changed
        id: site
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -f site/package.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE_SHA" ] || git diff --name-only "$BASE_SHA...HEAD" | grep -q '^site/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        if: steps.site.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Save pull request metadata
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"number": %s, "head_sha": "%s"}\n' "$PR_NUMBER" "$HEAD_SHA" > pr.json

      - name: Upload pull request metadata
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-meta
          path: pr.json
          retention-days: 1
