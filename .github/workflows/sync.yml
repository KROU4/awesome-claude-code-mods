# Regenerates registry.json, .claude-plugin/marketplace.json, the README blocks and data/ after
# every change to main (and nightly for stars and external mods), lands them through a pull request
# the bot opens and merges itself (main accepts changes only through pull requests), then builds
# and deploys the site with the fresh registry.
#
# Security: the work that reads contributors' code (`claude plugin validate` of hosted mods,
# cloning and validating external repositories) runs in `build` with a read-only token and no
# stored credentials. `verify` checks the `catalog` artifact with bash and jq against main
# (scripts/verify-catalog-artifact.sh) before `land` or `deploy` use it. `land` holds the write
# token and runs no npm, node or claude: it copies the generated files from the artifact and
# commits them through a pull request. The site deploys whenever build and verify passed, even if
# landing the pull request failed. Actions are pinned to commit SHAs.
name: Sync and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  build:
    name: Regenerate the catalog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # No npm cache: a cache written here would be restored by later runs.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install the Claude Code CLI
        id: cli
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302
          claude --version

      - name: Analyze mods with claude plugin validate
        run: npm run analyze

      - name: Read stars, dates, marketplace names and maintainer ids from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run enrich

      - name: Build registry, marketplace and README blocks
        run: npm run build:registry

      - name: Validate the marketplace
        if: steps.cli.outcome == 'success'
        run: claude plugin validate --strict .claude-plugin/marketplace.json

      - name: Keep the generated files for the land and deploy jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog
          # Without it .claude-plugin/ is left out.
          include-hidden-files: true
          retention-days: 7
          path: |
            registry.json
            .claude-plugin/marketplace.json
            README.md
            README.en.md
            data/

  verify:
    name: Check the generated files
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the generated files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      - name: Check them against main
        run: bash scripts/verify-catalog-artifact.sh "$RUNNER_TEMP/catalog"

  land:
    name: Open and merge a sync pull request
    needs: [build, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the generated files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      - name: Copy only the generated paths
        run: |
          src="$RUNNER_TEMP/catalog"
          for f in registry.json .claude-plugin/marketplace.json README.md README.en.md; do
            test -f "$src/$f"
            cp "$src/$f" "$f"
          done
          test -d "$src/data"
          rm -rf data
          cp -r "$src/data" data

      - name: Open and merge a sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/sync-${{ github.run_id }}
        run: |
          paths="registry.json .claude-plugin/marketplace.json README.md README.en.md data"
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "Nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # shellcheck disable=SC2086
          git add -A -- $paths
          git commit -m "chore(registry): sync catalog"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(registry): sync catalog" \
            --body "Regenerated by the Sync workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}): registry.json, .claude-plugin/marketplace.json, README blocks and data/."
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$(git rev-parse HEAD)"

  # After land, so the site and main agree when both work; but a failed land (say, a squash
  # conflict with a change that reached main meanwhile) does not hold back the site.
  deploy:
    name: Build and deploy the site
    needs: [build, verify, land]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the fresh registry
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      # The site's prebuild (site/scripts/snapshot.mjs) copies registry.json to site/public/
      # (served next to the page, fetched when GitHub does not answer); nothing is bundled.
      - name: Use the fresh registry
        run: cp "$RUNNER_TEMP/catalog/registry.json" registry.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
