# Regenerates registry.json, .claude-plugin/marketplace.json, the README blocks and data/ after
# every change to main (and nightly for stars and external mods), lands them through a pull request
# the bot opens and merges itself (main accepts changes only through pull requests), then builds
# and deploys the site with the fresh registry.
name: Sync and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Claude Code CLI
        id: cli
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302
          claude --version

      - name: Analyze mods with claude plugin validate
        run: npm run analyze

      - name: Read stars and dates from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run enrich

      - name: Build registry, marketplace and README blocks
        run: npm run build:registry

      - name: Validate the marketplace
        if: steps.cli.outcome == 'success'
        run: claude plugin validate --strict .claude-plugin/marketplace.json

      - name: Keep the registry for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: registry
          path: registry.json
          retention-days: 7

      - name: Open and merge a sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/sync-${{ github.run_id }}
        run: |
          paths="registry.json .claude-plugin/marketplace.json README.md README.en.md data"
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "Nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # shellcheck disable=SC2086
          git add -- $paths
          git commit -m "chore(registry): sync catalog"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(registry): sync catalog" \
            --body "Regenerated by the Sync workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}): registry.json, .claude-plugin/marketplace.json, README blocks and data/."
          gh pr merge "$BRANCH" --squash --delete-branch

  deploy:
    name: Build and deploy the site
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the fresh registry
        uses: actions/download-artifact@v4
        with:
          name: registry
          path: ${{ runner.temp }}/registry

      - name: Use the fresh registry
        run: |
          cp "$RUNNER_TEMP/registry/registry.json" registry.json
          mkdir -p site/src/data
          cp "$RUNNER_TEMP/registry/registry.json" site/src/data/registry.snapshot.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
